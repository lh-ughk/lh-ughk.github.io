<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Wave</title>
  <style>
    :root { --bg:#0A0D11; --card:#12161C; --border:#ffffff1f; --text:#F3F5F8; --muted:#98A4B4; --accent:#2BC8DE; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .wrap { max-width:620px; margin:0 auto; padding:80px 22px; text-align:center; }
    .dot { width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,#2BC8DE,#4571E8); margin:0 auto 20px; }
    h1 { font-size:32px; margin:0 0 6px; }
    p { color:var(--muted); }
    .links { display:flex; gap:14px; justify-content:center; margin-top:28px; flex-wrap:wrap; }
    a.btn { display:inline-block; padding:13px 22px; border-radius:12px; background:var(--card); border:1px solid var(--border); color:var(--text); text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="dot"></div>
    <h1>QR Wave</h1>
    <p>Scan. Create. Connect. — a fast, private QR scanner &amp; generator.</p>
    <div class="links">
      <a class="btn" href="privacy.html">Privacy Policy</a>
      <a class="btn" href="terms.html">Terms of Service</a>
    </div>
  </div>
</body>
</html>
