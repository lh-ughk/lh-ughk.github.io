<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher Dev — Apps</title>
<meta name="description" content="Apps built by Cipher Dev — privacy-focused tools for everyone.">
<style>
  :root{
    --bg:#0a0e1a; --card:#151b2e; --border:rgba(255,255,255,.08);
    --txt:#e8ecf5; --muted:#8b94a8; --primary:#3b82f6; --accent:#06b6d4;
    --grad:linear-gradient(135deg,#3b82f6 0%,#06b6d4 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh;
       display:flex;flex-direction:column}

  nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;
      justify-content:space-between;padding:14px 24px;
      background:rgba(10,14,26,.85);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border)}
  .logo{font-weight:700;font-size:18px;color:var(--txt);text-decoration:none}
  .logo span{background:var(--grad);-webkit-background-clip:text;
      background-clip:text;-webkit-text-fill-color:transparent}

  .hero{text-align:center;padding:80px 24px 56px;
        background:radial-gradient(ellipse at top,rgba(59,130,246,.12),transparent 60%)}
  .hero h1{font-size:clamp(32px,8vw,52px);font-weight:800;letter-spacing:-1px;
        margin-bottom:16px}
  .hero h1 .grad{background:var(--grad);-webkit-background-clip:text;
        background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{font-size:clamp(15px,3.5vw,18px);color:var(--muted);max-width:480px;margin:0 auto}

  main{flex:1;max-width:900px;margin:0 auto;padding:48px 24px}
  .section-label{font-size:12px;font-weight:600;letter-spacing:.08em;
        text-transform:uppercase;color:var(--muted);margin-bottom:20px}

  .apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
  .app-card{background:var(--card);border:1px solid var(--border);border-radius:18px;
        padding:28px 24px;text-decoration:none;color:inherit;
        transition:transform .25s,border-color .25s,box-shadow .25s;display:block}
  .app-card:hover{transform:translateY(-4px);border-color:rgba(59,130,246,.4);
        box-shadow:0 12px 32px rgba(0,0,0,.3)}
  .app-icon{width:52px;height:52px;border-radius:14px;
        background:rgba(59,130,246,.12);display:flex;align-items:center;
        justify-content:center;margin-bottom:18px}
  .app-icon svg{width:30px;height:30px}
  .app-name{font-size:18px;font-weight:700;margin-bottom:6px}
  .app-desc{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:18px}
  .app-links{display:flex;gap:12px;flex-wrap:wrap}
  .app-links a{font-size:13px;color:var(--primary);text-decoration:none;font-weight:500;
        padding:5px 12px;border:1px solid rgba(59,130,246,.3);border-radius:8px;
        transition:background .2s,border-color .2s}
  .app-links a:hover{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.5)}

  footer{border-top:1px solid var(--border);padding:32px 24px;text-align:center;
        color:#5a627a;font-size:13px}
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html"><span>Cipher Dev</span></a>
</nav>

<header class="hero">
  <h1>Apps by <span class="grad">Cipher Dev</span></h1>
  <p>Privacy-focused tools built for everyone.</p>
</header>

<main>
  <p class="section-label">Our Apps</p>
  <div class="apps">

    <a class="app-card" href="securelink-vpn/index.html">
      <div class="app-icon">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
              <stop stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
          <path d="M32 4 L56 14 V32 C56 47 45 57 32 60 C19 57 8 47 8 32 V14 Z" fill="url(#g1)"/>
          <path d="M22 32 l7 7 l14 -14" stroke="#fff" stroke-width="4.5"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <div class="app-name">Secure Link VPN</div>
      <div class="app-desc">Encrypted, no-logs VPN for Android. Fast servers and strong privacy, built for everyone.</div>
      <div class="app-links">
        <a href="securelink-vpn/index.html" onclick="event.stopPropagation()">Home</a>
        <a href="securelink-vpn/privacy.html" onclick="event.stopPropagation()">Privacy</a>
        <a href="securelink-vpn/terms.html" onclick="event.stopPropagation()">Terms</a>
      </div>
    </a>

  </div>
</main>

<footer>© 2026 Cipher Dev. All rights reserved.</footer>

</body>
</html>
